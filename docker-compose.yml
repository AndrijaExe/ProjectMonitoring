services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
    ports:
      # 5433 on the host keeps a locally installed Postgres usable at the same time.
      - '5433:5432'
    volumes:
      - monitoring-db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monitoring -d monitoring']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  monitoring-db:
