# Render Blueprint: API + console, both on free instances.
# The database lives on Supabase and the schedule lives in GitHub Actions, because Render
# charges for Postgres and has no free cron. See DEPLOY.md.

services:
  - type: web
    name: monitoring-api
    runtime: docker
    region: frankfurt
    # Free instances sleep after 15 minutes without traffic and wake on the next request,
    # which takes the better part of a minute. The scheduled poll keeps this one awake.
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: '0'
      - key: APP_SECRET
        generateValue: true
      # Generated, so the console is never reachable with a token from the repository.
      # Read it once in the dashboard: it is the sign-in password.
      - key: ADMIN_TOKEN
        generateValue: true
      # The phone app's credential. Reads the whole board and may ask for a probe, but cannot
      # stop a service, clear history or send mail, so a lost phone costs nothing but a rotation.
      # Separate from the value above on purpose: glancing at the board from a pocket and taking
      # a service down are not the same decision. Read it once in the dashboard.
      - key: ADMIN_READONLY_TOKEN
        generateValue: true
      - key: LOOP9_INGEST_TOKEN
        generateValue: true
      # Supabase connection string. Use a pooler URL, not the direct one: the direct host
      # is IPv6 only. Port 6543 is fine, the app detects the pooler and adjusts.
      - key: DATABASE_URL
        sync: false
      # The console URL, e.g. https://monitoring-console.onrender.com. Without it the
      # browser blocks every API call.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PROBE_TIMEOUT_SECONDS
        value: '20'
      # The poll runs hourly from GitHub Actions, so two hours without a probe means the
      # schedule stopped rather than that a run was slow. The console says so on the board.
      - key: POLL_MAX_AGE_MINUTES
        value: '120'
      # Optional. A Render API key turns on the logs panel in the console. Leave it unset
      # and the panel simply says so. The key is read server-side only and never reaches
      # the browser, which matters because it authorises everything the dashboard can do.
      - key: RENDER_API_KEY
        sync: false
      # Lets the console stop, start and rebuild a target's service through the key above.
      # Separate from it on purpose: reading logs and taking a service down are not the same
      # decision, so the panel is readable with the key alone and acts only with this. The
      # application default is off; this blueprint is the deployment that asked for the buttons.
      - key: CONTROLS_ENABLED
        value: 'true'
      # Optional. Email alerts on health changes, sent over HTTPS rather than SMTP because
      # Render blocks ports 25, 465 and 587 on free services. Leave either of the first two
      # unset and the monitor simply stays quiet.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_EMAIL_FROM
        value: onboarding@resend.dev
      # Ceilings for a game's own counters, as "name=limit" pairs per hour. Only the counters
      # named here are watched; the other metric alarms fire on a change and need no number.
      - key: ALERT_RATE_PER_HOUR
        value: api.errors=20,ai.failed=10,safety.unavailable=10,chat.denied.player_daily=0,chat.denied.player_monthly=0,abuse.watch=0
      # Optional. Where Loop 9 publishes its own counters, and the secret for reading them
      # as "loop9=<token>". The token must match METRICS_TOKEN on the game's service.
      # Unset means the console shows probes only, which is what it did before.
      - key: LOOP9_METRICS_URL
        value: https://loop9-backend.onrender.com/metrics
      - key: METRICS_TOKENS
        sync: false

  - type: web
    name: monitoring-console
    runtime: static
    # Built from the repository root rather than frontend/, because the console shares its API
    # client and store with the phone app in shared/, and an install rooted at frontend/ cannot
    # reach the folder above it. This installs the phone app's dependencies too, which is a
    # minute of build time rather than a correctness problem.
    buildCommand: npm ci && npm run build --workspace frontend
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
        # A change to the shared client is a change to the console.
        - shared/**
        - package.json
        - package-lock.json
    envVars:
      # RENDER_EXTERNAL_HOSTNAME is the public host of the API, so the console finds it
      # without anyone pasting a URL. vite.config.ts turns it into VITE_API_BASE_URL.
      - key: API_HOST
        fromService:
          name: monitoring-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      # Client-side routing: /projects/loop9 must not 404 on reload.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
