# Render Blueprint: API + console + database + scheduled polling.
# Create it once with New > Blueprint, then every push to the default branch redeploys
# whichever half of the monorepo changed.

databases:
  - name: monitoring-db
    databaseName: monitoring
    user: monitoring
    region: frankfurt
    # No plan here on purpose: pick one in the dashboard. A free database is deleted
    # after 30 days, which takes the probe history with it.

services:
  - type: web
    name: monitoring-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: '0'
      - key: APP_SECRET
        generateValue: true
      # Generated, so the console is never reachable with a token from the repository.
      # Read it once in the dashboard: it is the sign-in password.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LOOP9_INGEST_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: monitoring-db
          property: connectionString
      # Set this to the console URL after the first deploy, e.g.
      # https://monitoring-console.onrender.com. Without it the browser blocks the SPA.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PROBE_TIMEOUT_SECONDS
        value: '20'

  - type: web
    name: monitoring-console
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # RENDER_EXTERNAL_HOSTNAME is the public host of the API, so the console finds it
      # without anyone pasting a URL. vite.config.ts turns it into VITE_API_BASE_URL.
      - key: API_HOST
        fromService:
          name: monitoring-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      # Client-side routing: /projects/loop9 must not 404 on reload.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: cron
    name: monitoring-poll
    runtime: docker
    region: frankfurt
    # Every five minutes, so the board holds real history instead of whatever the last
    # visitor happened to trigger.
    schedule: '*/5 * * * *'
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: php bin/console app:poll-health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: '0'
      - key: APP_SECRET
        fromService:
          name: monitoring-api
          type: web
          envVarKey: APP_SECRET
      - key: ADMIN_TOKEN
        fromService:
          name: monitoring-api
          type: web
          envVarKey: ADMIN_TOKEN
      - key: DATABASE_URL
        fromDatabase:
          name: monitoring-db
          property: connectionString
      - key: PROBE_TIMEOUT_SECONDS
        value: '20'
