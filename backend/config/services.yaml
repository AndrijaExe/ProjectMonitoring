# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Model\ProjectRepository:
        alias: App\Adapter\Persistence\Postgres\PdoProjectRepository
        public: false

    App\Model\HealthSnapshotStore:
        alias: App\Adapter\Persistence\Postgres\PdoHealthSnapshotStore
        public: false

    App\Model\MetricStore:
        alias: App\Adapter\Persistence\Postgres\PdoMetricStore
        public: false

    App\Model\HealthProbe:
        alias: App\Adapter\Probe\HttpHealthProbe
        public: false

    App\Model\LogSource:
        alias: App\Adapter\Logs\RenderLogSource
        public: false

    # Both routes at once. The two concrete channels stay injectable by class, so the fan-out
    # can hold them without the interface pointing back at itself.
    App\Model\AlertChannel:
        alias: App\Adapter\Alerting\FanOutAlertChannel
        public: false

    App\Model\DeviceTokenStore:
        alias: App\Adapter\Persistence\Postgres\PdoDeviceTokenStore
        public: false

    App\Model\ServiceControl:
        alias: App\Adapter\Render\RenderServiceControl
        public: false
