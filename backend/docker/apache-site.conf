<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Symfony has no .htaccess here, so route everything through the front controller.
        FallbackResource /index.php
    </Directory>

    <Directory /var/www/html/public/bundles>
        FallbackResource disabled
    </Directory>

    # The container sits behind Render's proxy; keep request logs on stdout.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
