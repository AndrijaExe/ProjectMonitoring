name: Poll health

# Render's cron jobs are paid, so the schedule lives here instead. This also keeps the free
# API instance awake, which means the console usually loads without a cold start.
on:
  schedule:
    # Every half hour, and the interval is money rather than politeness. A workspace gets 750
    # free instance hours a month; only monitoring-api spends them, because the console is a
    # static site and the game is on a paid plan that is always awake anyway.
    #
    # A poll wakes the API for its 15 minute idle window, a quarter of an hour, so the monthly
    # bill is a quarter of the number of polls: hourly costs 180 hours, half-hourly 360, every
    # twenty minutes 540. Anything under fifteen minutes never lets it sleep at all and spends
    # the whole 730 hour month, which leaves no margin before Render suspends the service.
    #
    # Half-hourly is also the ceiling on how late a push alert can be, which is the other half
    # of why it is not hourly.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-health
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A free Render service that is asleep cannot be woken from another Render service:
      # the edge answers 429 to the request that would have started it, so the probe never
      # reaches the target and the console can only record "throttled". The same request
      # from anywhere else wakes it normally, so the wake-up happens here, from a runner.
      - name: Wake the targets from outside Render
        env:
          WARM_URLS: ${{ vars.WARM_URLS }}
        run: |
          set -u

          if [ -z "${WARM_URLS:-}" ]; then
            echo 'No WARM_URLS variable, skipping. Probes will read throttled if a target sleeps.'
            exit 0
          fi

          for url in ${WARM_URLS}; do
            # Waking takes about a minute, and a failure here is not a verdict: the probe
            # that follows is what decides whether the target is healthy.
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 120 --retry 2 --retry-delay 10 --retry-all-errors \
              "${url}" || echo '000')
            echo "woke ${url} -> ${code}"
          done

      - name: Ask the API to probe every project
        env:
          API_URL: ${{ vars.API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -eu

          if [ -z "${API_URL:-}" ] || [ -z "${ADMIN_TOKEN:-}" ]; then
            echo 'Set the API_URL repository variable and the ADMIN_TOKEN repository secret.' >&2
            exit 1
          fi

          # A sleeping free instance drops the request that wakes it, and waking can take
          # close to a minute, so a cold start must not read as a failed poll.
          code=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 120 \
            -X POST "${API_URL%/}/api/v1/poll" \
            -H "X-Admin-Token: ${ADMIN_TOKEN}")

          echo "HTTP ${code}"
          cat response.json || true
          echo

          if [ "${code}" != '200' ]; then
            echo "Poll failed with HTTP ${code}." >&2
            exit 1
          fi

          # A 200 that probed nothing is not a healthy poll. It means the projects table is
          # empty or unreadable, and every status in the console is then quietly frozen.
          polled=$(jq -r '.polled // 0' response.json 2>/dev/null || echo 0)
          case "${polled}" in '' | *[!0-9]*) polled=0 ;; esac

          if [ "${polled}" -lt 1 ]; then
            echo 'The API answered 200 but probed no projects.' >&2
            exit 1
          fi

          echo "Probed ${polled} endpoints."

      # Everything above can stop happening without anyone hearing it. A suspended instance,
      # an expired token, or GitHub disabling this schedule after 60 days without a commit
      # all end the same way: no probe runs, so no status changes, so no alert is sent, and
      # the console keeps showing yesterday's green. This ping is the question asked from the
      # outside instead: a run that does not report in makes the heartbeat service mail you.
      - name: Report to the dead man's switch
        if: ${{ always() }}
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u

          if [ -z "${HEARTBEAT_URL:-}" ]; then
            echo 'No HEARTBEAT_URL secret, so nothing outside this workflow would notice if it stopped.'
            exit 0
          fi

          # A cancelled run was somebody's decision, and they do not need a mail about it.
          if [ "${JOB_STATUS}" = 'cancelled' ]; then
            echo 'Run cancelled, so no heartbeat either way.'
            exit 0
          fi

          # Failing loudly beats waiting for the grace period to run out: healthchecks.io
          # alerts on /fail at once, and a poll that failed is already worth knowing about.
          if [ "${JOB_STATUS}" = 'success' ]; then
            target="${HEARTBEAT_URL%/}"
          else
            target="${HEARTBEAT_URL%/}/fail"
          fi

          # Never the reason the workflow goes red: the poll's own verdict decides that.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 "${target}" || echo '000')
          echo "heartbeat (${JOB_STATUS}) -> ${code}"
