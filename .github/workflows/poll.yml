name: Poll health

# Render's cron jobs are paid, so the schedule lives here instead. This also keeps the free
# API instance awake, which means the console usually loads without a cold start.
on:
  schedule:
    # Five minutes rather than ten: GitHub delays scheduled runs under load, and a gap
    # longer than 15 minutes lets the free instance sleep, which costs a 40 second wake-up
    # on the next visit. Minutes are free on a public repository.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: poll-health
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the API to probe every project
        env:
          API_URL: ${{ vars.API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -eu

          if [ -z "${API_URL:-}" ] || [ -z "${ADMIN_TOKEN:-}" ]; then
            echo 'Set the API_URL repository variable and the ADMIN_TOKEN repository secret.' >&2
            exit 1
          fi

          # A sleeping free instance drops the request that wakes it, and waking can take
          # close to a minute, so a cold start must not read as a failed poll.
          code=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 120 \
            -X POST "${API_URL%/}/api/v1/poll" \
            -H "X-Admin-Token: ${ADMIN_TOKEN}")

          echo "HTTP ${code}"
          cat response.json || true
          echo

          if [ "${code}" != '200' ]; then
            echo "Poll failed with HTTP ${code}." >&2
            exit 1
          fi
